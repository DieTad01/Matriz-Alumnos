<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz Triangular | Panel</title>

    <!-- Fuente y estilos compartidos con la página principal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="panel-page">
    <header class="site-header">
        <a class="brand" href="../index.html">
            <span class="brand-mark">M</span>
            <span>Matriz Triangular<span class="brand-accent">.</span></span>
        </a>

        <a class="text-link dark-link" href="../index.html">
            ← Informacion
        </a>
    </header>

    <main class="panel-main section-wrap">
        <!-- Título del panel -->
        <section class="panel-heading">
            <p class="eyebrow">Plataforma</p>
            <h1>Generación de matriz</h1>
            <p class="body-copy">Apoyo para la gestión de grupos.</p>
        </section>

        <!-- Datos temporales: se reemplazarán cuando llegue el Excel -->
        <section class="metric-grid">
            <article class="metric-card">
                <span>Alumnos registrados</span>
                <strong>128</strong>
                <small>Dato de ejemplo</small>
            </article>
        </section>

        <!-- Espacio reservado para importar archivos -->
        <section class="notice-card">
            <span class="notice-icon">✦</span>
            <h2>Archivos</h2>
            <p>
                En esta sección se agregarán y recibirán los archivos necesarios para generar la matriz.
            </p>
            <button class="button button-primary" type="button">
                Próximamente
            </button>
        </section>
    </main>

    <script src="../js/animaciones.js"></script>
</body>

</html>
